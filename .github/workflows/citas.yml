name: Comprobar citas GVA

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (mínimo permitido; puede retrasarse)
  workflow_dispatch:         # ejecución manual desde la pestaña Actions
    inputs:
      test:
        description: 'Enviar mensaje de prueba a Telegram aunque no haya citas'
        type: boolean
        default: false
      center_id:
        description: 'CENTER_ID (opcional; por defecto la variable del repo)'
        type: string
      service_id:
        description: 'SERVICE_ID (opcional; por defecto la variable del repo)'
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl

      - name: Comprobar citas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          CENTER_ID: ${{ inputs.center_id || vars.CENTER_ID }}
          SERVICE_ID: ${{ inputs.service_id || vars.SERVICE_ID }}
          TEST: ${{ inputs.test && '1' || '' }}
        run: php index.php
